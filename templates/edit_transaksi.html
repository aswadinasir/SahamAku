{% extends "base.html" %}
{% block title %}Edit Transaksi - SahamAku{% endblock %}
{% block content %}
<h1>Edit Transaksi</h1>

<section class="kad">
  <form method="post" class="borang">
    <div class="borang-baris">
      <label>Tarikh
        <input type="date" name="tarikh" value="{{ t.tarikh }}" required>
      </label>
      <label>Masa (pilihan)
        <input type="time" name="masa" step="1" value="{{ t.masa or '' }}">
      </label>
      <label>Pasaran
        <select name="pasaran" id="f-pasaran">
          <option value="MY" {{ "selected" if t.pasaran == "MY" }}>MY (RM)</option>
          <option value="US" {{ "selected" if t.pasaran == "US" }}>US (USD)</option>
        </select>
      </label>
      <label>Kaunter
        <input type="text" name="kaunter" value="{{ t.kaunter }}" required>
      </label>
      <label>Jenis
        <select name="jenis" required>
          <option value="BELI" {{ "selected" if t.jenis == "BELI" }}>BELI</option>
          <option value="JUAL" {{ "selected" if t.jenis == "JUAL" }}>JUAL</option>
        </select>
      </label>
    </div>
    <div class="borang-baris">
      <label>Kuantiti (unit)
        <input type="number" name="kuantiti" id="f-kuantiti" min="0.000001" step="any" value="{{ t.kuantiti }}" required>
      </label>
      <label>Harga / Unit (ikut pasaran)
        <input type="number" name="harga_seunit" min="0" step="0.0001" value="{{ t.harga_seunit }}" required>
      </label>
      <label id="f-kadar-wrap" {{ "hidden" if t.pasaran == "MY" }}>Kadar Tukaran (ke RM)
        <input type="number" name="kadar_tukaran" id="f-kadar-tukaran" min="0.000001" step="0.000001" value="{{ t.kadar_tukaran or '' }}" placeholder="cth 4.2650">
      </label>
    </div>
    <div class="borang-baris">
      <label>Komisen
        <input type="number" name="komisen" min="0" step="0.01" value="{{ t.komisen }}">
      </label>
      <label>Yuran Platform
        <input type="number" name="yuran_platform" min="0" step="0.01" value="{{ t.yuran_platform }}">
      </label>
      <label>Yuran Kliring
        <input type="number" name="yuran_kliring" min="0" step="0.01" value="{{ t.yuran_kliring }}">
      </label>
    </div>
    <div class="borang-baris">
      <label>Duti Setem
        <input type="number" name="duti_setem" min="0" step="0.01" value="{{ t.duti_setem }}">
      </label>
      <label>SST
        <input type="number" name="sst" min="0" step="0.01" value="{{ t.sst }}">
      </label>
      <label>Caj Lain
        <input type="number" name="caj_lain" min="0" step="0.01" value="{{ t.caj_lain }}">
      </label>
    </div>
    <div class="borang-baris">
      <label class="lebar-penuh">Nota (pilihan)
        <input type="text" name="nota" value="{{ t.nota or '' }}">
      </label>
    </div>
    <button type="submit" class="btn btn-utama">Kemaskini</button>
    <a href="{{ url_for('senarai_transaksi') }}" class="btn">Batal</a>
  </form>
</section>

<script>
  (function () {
    var selPasaran = document.getElementById("f-pasaran");
    var inputKuantiti = document.getElementById("f-kuantiti");
    var kadarWrap = document.getElementById("f-kadar-wrap");
    function kemaskini() {
      if (selPasaran.value === "MY") {
        inputKuantiti.step = "1";
        inputKuantiti.min = "1";
        kadarWrap.hidden = true;
      } else {
        inputKuantiti.step = "any";
        inputKuantiti.min = "0.000001";
        kadarWrap.hidden = false;
      }
    }
    selPasaran.addEventListener("change", kemaskini);
    kemaskini();
  })();
</script>
{% endblock %}
